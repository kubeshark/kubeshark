on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Release

concurrency:
  group: kubeshark-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish a new release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'

      - name: Version
        id: version
        shell: bash
        run: |
          {
            echo "tag=${GITHUB_REF#refs/*/}"
            echo "build_timestamp=$(date +%s)"
            echo "branch=${GITHUB_REF#refs/heads/}"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: make build-all VER='${{ steps.version.outputs.tag }}' BUILD_TIMESTAMP='${{ steps.version.outputs.build_timestamp }}'

      - name: Log the version into a .txt file
        shell: bash
        run: |
          echo '${{ steps.version.outputs.tag }}' >> bin/version.txt

      - name: Create MCP Registry artifacts
        shell: bash
        run: |
          cd bin
          # Create .mcpb copies for MCP Registry (URL must contain "mcp")
          for f in kubeshark_linux_amd64 kubeshark_linux_arm64 kubeshark_darwin_amd64 kubeshark_darwin_arm64; do
            if [ -f "$f" ]; then
              cp "$f" "${f/kubeshark_/kubeshark-mcp_}.mcpb"
              shasum -a 256 "${f/kubeshark_/kubeshark-mcp_}.mcpb" > "${f/kubeshark_/kubeshark-mcp_}.mcpb.sha256"
            fi
          done
          # Handle Windows executable
          if [ -f "kubeshark.exe" ]; then
            cp kubeshark.exe kubeshark-mcp_windows_amd64.mcpb
            shasum -a 256 kubeshark-mcp_windows_amd64.mcpb > kubeshark-mcp_windows_amd64.mcpb.sha256
          fi

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "bin/*"
          tag: ${{ steps.version.outputs.tag }}
          prerelease: false
          bodyFile: 'bin/README.md'

  mcp-publish:
    name: Publish to MCP Registry
    needs: [release]
    uses: ./.github/workflows/mcp-publish.yml
    with:
      release_tag: ${{ needs.release.outputs.version }}

  # A packslip is the release's signed inventory: each binary's digest and
  # platform, signed with this workflow's identity, plus where to get shell
  # completions and the AI skills for the same version. Installers such as
  # mise check downloads against it. See https://packslip.dev.
  packslip:
    name: Publish a signed packslip
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Upload the bundle to the release.
      id-token: write      # Sign with this workflow's identity.
      attestations: write  # Publish build provenance for the binaries.
    steps:
      # kubeshark.exe's name says neither its platform nor that it is the
      # program itself rather than an installer, so a manifest states both.
      - name: Download the release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.version }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir bin \
            -p kubeshark_linux_amd64 -p kubeshark_linux_arm64 \
            -p kubeshark_darwin_amd64 -p kubeshark_darwin_arm64 -p kubeshark.exe
          cat > "$RUNNER_TEMP/packslip.toml" <<'TOML'
          [[artifact]]
          path = "bin/kubeshark.exe"
          os = "windows"
          arch = "x86_64"
          format = "raw"
          TOML

      - uses: jdx/packslip@v1
        with:
          artifacts: bin/kubeshark_linux_amd64 bin/kubeshark_linux_arm64 bin/kubeshark_darwin_amd64 bin/kubeshark_darwin_arm64 bin/kubeshark.exe
          manifest: ${{ runner.temp }}/packslip.toml
          bin: kubeshark
          resources: |
            completion/bash,zsh,fish,powershell=exec:kubeshark completion {shell}
            skill/install=repo:skills/install
            skill/kfl=repo:skills/kfl
            skill/network-rca=repo:skills/network-rca
            skill/security-audit=repo:skills/security-audit
