on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Release

concurrency:
  group: kubeshark-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish a new release
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Create the release and upload its assets.
      id-token: write          # Sign the build provenance below.
      attestations: write      # Store that provenance.
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'

      - name: Version
        id: version
        shell: bash
        run: |
          {
            echo "tag=${GITHUB_REF#refs/*/}"
            echo "build_timestamp=$(date +%s)"
            echo "branch=${GITHUB_REF#refs/heads/}"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: make build-all VER='${{ steps.version.outputs.tag }}' BUILD_TIMESTAMP='${{ steps.version.outputs.build_timestamp }}'

      # Attest the binaries from the bytes this job just built, so the
      # packslip job below links this provenance instead of attesting copies
      # it downloads back from the release.
      # A Sigstore outage must not stop the release, so this step may fail.
      - name: Attest the release binaries
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            bin/kubeshark_linux_amd64
            bin/kubeshark_linux_arm64
            bin/kubeshark_darwin_amd64
            bin/kubeshark_darwin_arm64
            bin/kubeshark.exe

      - name: Log the version into a .txt file
        shell: bash
        run: |
          echo '${{ steps.version.outputs.tag }}' >> bin/version.txt

      - name: Create MCP Registry artifacts
        shell: bash
        run: |
          cd bin
          # Create .mcpb copies for MCP Registry (URL must contain "mcp")
          for f in kubeshark_linux_amd64 kubeshark_linux_arm64 kubeshark_darwin_amd64 kubeshark_darwin_arm64; do
            if [ -f "$f" ]; then
              cp "$f" "${f/kubeshark_/kubeshark-mcp_}.mcpb"
              shasum -a 256 "${f/kubeshark_/kubeshark-mcp_}.mcpb" > "${f/kubeshark_/kubeshark-mcp_}.mcpb.sha256"
            fi
          done
          # Handle Windows executable
          if [ -f "kubeshark.exe" ]; then
            cp kubeshark.exe kubeshark-mcp_windows_amd64.mcpb
            shasum -a 256 kubeshark-mcp_windows_amd64.mcpb > kubeshark-mcp_windows_amd64.mcpb.sha256
          fi

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "bin/*"
          tag: ${{ steps.version.outputs.tag }}
          prerelease: false
          bodyFile: 'bin/README.md'

  mcp-publish:
    name: Publish to MCP Registry
    needs: [release]
    uses: ./.github/workflows/mcp-publish.yml
    with:
      release_tag: ${{ needs.release.outputs.version }}

  # A packslip is the release's signed inventory: each binary's digest and
  # platform, signed with this workflow's identity, plus where to get shell
  # completions and the AI skills for the same version. Installers such as
  # mise check downloads against it. See https://packslip.dev.
  #
  # Signing runs in a job that can only read the release, and a second job
  # uploads the one bundle file. Neither job can stop the release or the MCP
  # Registry publish: a packslip failure just means this release has none.
  packslip:
    name: Sign a packslip
    needs: [release]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read  # Download the release binaries.
      id-token: write # Sign with this workflow's identity.
    steps:
      # The action checks the packslip binary only against jdx/packslip as a
      # whole, and release assets can be replaced, so pin the bytes here.
      # Bump PACKSLIP_VERSION and PACKSLIP_SHA256 with the action pin.
      - name: Install packslip
        env:
          GH_TOKEN: ${{ github.token }}
          PACKSLIP_VERSION: 1.5.1
          PACKSLIP_SHA256: d401822be0f4c0494dde170657499fc197709b530e18b547906dafe05c155d45
        run: |
          dir="${RUNNER_TEMP}/packslip-pinned"
          asset="packslip-v${PACKSLIP_VERSION}-linux-x64.tar.xz"
          gh release download "v${PACKSLIP_VERSION}" --repo jdx/packslip \
            --pattern "$asset" --dir "$dir"
          echo "${PACKSLIP_SHA256}  ${dir}/${asset}" | sha256sum --check -
          tar -xJf "${dir}/${asset}" -C "$dir" --strip-components=1

      # kubeshark.exe's name says neither its platform nor that it is the
      # program itself rather than an installer, so a manifest states both.
      - name: Download the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.version }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir bin \
            -p kubeshark_linux_amd64 -p kubeshark_linux_arm64 \
            -p kubeshark_darwin_amd64 -p kubeshark_darwin_arm64 -p kubeshark.exe
          cat > "$RUNNER_TEMP/packslip.toml" <<'TOML'
          [[artifact]]
          path = "bin/kubeshark.exe"
          os = "windows"
          arch = "x86_64"
          format = "raw"
          TOML

      - uses: jdx/packslip@22be7aeb840156291e1ae795ca37b36a2dc1969c # v1.5.1
        id: packslip
        with:
          packslip-path: ${{ runner.temp }}/packslip-pinned/packslip
          artifacts: bin/kubeshark_linux_amd64 bin/kubeshark_linux_arm64 bin/kubeshark_darwin_amd64 bin/kubeshark_darwin_arm64 bin/kubeshark.exe
          manifest: ${{ runner.temp }}/packslip.toml
          bin: kubeshark
          attest: link
          upload: false
          resources: |
            completion/bash,zsh,fish,powershell=exec:kubeshark completion {shell}
            skill/install=repo:skills/install
            skill/kfl=repo:skills/kfl
            skill/network-rca=repo:skills/network-rca
            skill/security-audit=repo:skills/security-audit

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish-packslip:
    name: Upload the packslip
    needs: [release, packslip]
    if: needs.packslip.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: write # Upload the bundle to the release.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packslip-bundle
      - name: Upload the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.version }}
        run: gh release upload "$TAG" packslip.sigstore.json --repo "$GITHUB_REPOSITORY"
